<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E" />
  <title>PrinceW3</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #131a22;
      --border: rgba(255,255,255,0.08);
      --text: #e6edf3;
      --muted: #8b98a5;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }
    header { margin-bottom: 48px; }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    header p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0;
    }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover { text-decoration: underline; }

    h2.section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 16px;
    }

    .projects {
      display: grid;
      gap: 16px;
    }
    .card {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: rgba(88, 166, 255, 0.4);
      transform: translateY(-1px);
    }
    .card .emoji {
      font-size: 2.5rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .card .body { min-width: 0; }
    .card h3 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .card .tags {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.7rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 9px;
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PrinceW3</h1>
      <p>Projects, builds, and experiments. See more on <a href="https://github.com/PrinceW3" target="_blank" rel="noopener">GitHub</a>.</p>
    </header>

    <h2 class="section-title">Projects</h2>
    <div class="projects">
      <a class="card" href="/palsyr/">
        <div class="emoji">🐾</div>
        <div class="body">
          <h3>Palsyr</h3>
          <p>A mobile-first 2D creature-collecting RPG — explore an overworld, catch and breed Pals, battle trainers and friends, and trade on a simulated social platform.</p>
          <div class="tags">
            <span class="tag">React</span>
            <span class="tag">Canvas</span>
            <span class="tag">Game</span>
          </div>
        </div>
      </a>
    </div>

    <footer>
      &copy; <span id="year"></span> PrinceW3
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
